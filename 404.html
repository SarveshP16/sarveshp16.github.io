<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Sarvesh Pandit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050607">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23050607'/><path d='M50 14 78 25v23c0 17-12 29-28 38-16-9-28-21-28-38V25z' fill='none' stroke='%232bf0a4' stroke-width='7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  document.documentElement.classList.add('js');
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="fx-grid" aria-hidden="true"></div>
<div class="fx-scan" aria-hidden="true"></div>

<div class="layout">
  <main class="content" style="padding: 5rem 0 4rem;">
    <p class="eyebrow">HTTP_404 // NOT_FOUND</p>
    <h1 class="name">404</h1>
    <div class="panel term" style="margin: 2rem 0; max-width: 42rem;">
      <div class="term__bar">
        <span class="term__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>root@sarvesh:~</span>
      </div>
      <div class="term__body">
        <p class="term__cmd"><span class="prompt" aria-hidden="true">&#10148; ~ </span>stat .<span></span></p>
        <p>No such file or directory. That page doesn't exist, or it moved and I forgot to leave a redirect.</p>
        <p class="term__cmd"><span class="prompt" aria-hidden="true">&#10148; ~ </span><span class="caret" aria-hidden="true"></span></p>
      </div>
    </div>
    <p><a class="button" href="/">cd / <span aria-hidden="true">&#8594;</span></a></p>
  </main>
</div>

<div class="hud" aria-hidden="true">
  <ul>
    <li class="hud__item"><span class="hud__dot"></span>secure</li>
    <li class="hud__item">tls: 1.3</li>
    <li class="hud__gap"></li>
    <li class="hud__item hud__item--wide">status: <b>404</b></li>
  </ul>
</div>
</body>
</html>
